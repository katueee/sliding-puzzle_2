<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スライドパズル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .image-select {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-option {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s ease;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .image-option:hover {
            transform: scale(1.05);
            border-color: #ffd700;
        }

        .image-option.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label {
            color: white;
            font-size: 1rem;
            font-weight: bold;
        }

        .controls select, .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .controls select {
            background: white;
            color: #333;
        }

        .controls button {
            background: #ffd700;
            color: #333;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .controls button:hover {
            background: #ffed4a;
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            color: white;
            font-size: 1.1rem;
        }

        .stats span {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
        }

        .puzzle-container {
            position: relative;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .puzzle-board {
            display: grid;
            gap: 3px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .puzzle-tile {
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transition: transform 0.15s ease;
            border-radius: 4px;
        }

        .puzzle-tile:hover:not(.empty) {
            filter: brightness(1.1);
        }

        .puzzle-tile.empty {
            background: rgba(0,0,0,0.3) !important;
            cursor: default;
        }

        .complete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            display: none;
        }

        .complete-overlay.show {
            display: flex;
        }

        .complete-overlay p {
            margin-bottom: 15px;
        }

        .complete-overlay button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #ffd700;
            color: #333;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .preview-toggle {
            color: white;
            margin-bottom: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .preview-toggle:hover {
            opacity: 1;
        }

        .preview-image {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 100;
        }

        .preview-image.show {
            display: block;
        }
    </style>
</head>
<body>
    <h1>スライドパズル</h1>

    <p style="color: white; margin-bottom: 10px; font-weight: bold;">画像を選択してください:</p>
    <div class="image-select" id="imageSelect"></div>

    <div class="controls">
        <label for="gridSize">グリッドサイズ:</label>
        <select id="gridSize">
            <option value="3">3 x 3</option>
            <option value="4" selected>4 x 4</option>
            <option value="5">5 x 5</option>
        </select>
        <button onclick="startGame()">スタート</button>
        <button onclick="shufflePuzzle()">シャッフル</button>
    </div>

    <div class="stats">
        <span>手数: <strong id="moveCount">0</strong></span>
        <span>時間: <strong id="timer">00:00</strong></span>
    </div>

    <div class="preview-toggle" onclick="togglePreview()">[ 完成図を表示 ]</div>

    <div class="puzzle-container">
        <div class="puzzle-board" id="puzzleBoard"></div>
        <div class="complete-overlay" id="completeOverlay">
            <p>クリア!</p>
            <p id="completeStats" style="font-size: 1rem;"></p>
            <button onclick="startGame()">もう一度</button>
        </div>
    </div>

    <img id="previewImage" class="preview-image" alt="完成図">

    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    <p style="color: rgba(255,255,255,0.6); margin-top: 15px; font-size: 0.85rem; cursor: pointer;" onclick="document.getElementById('imageUpload').click()">+ 自分の画像をアップロード</p>

    <script>
        const defaultImages = [
            { name: 'ネコ', src: 'images/cat.jpg' },
            { name: 'イヌ', src: 'images/dog.jpg' }
        ];

        let images = [...defaultImages];
        let selectedImageIndex = 0;
        let gridSize = 4;
        let tiles = [];
        let emptyIndex;
        let moveCount = 0;
        let timerInterval;
        let startTime;
        let gameStarted = false;
        let tileSize = 90;

        function initImageSelect() {
            const container = document.getElementById('imageSelect');
            container.innerHTML = '';
            images.forEach((img, i) => {
                const imgEl = document.createElement('img');
                imgEl.src = img.src;
                imgEl.alt = img.name;
                imgEl.className = 'image-option' + (i === selectedImageIndex ? ' selected' : '');
                imgEl.onclick = () => selectImage(i);
                imgEl.title = img.name;
                container.appendChild(imgEl);
            });
        }

        function selectImage(index) {
            selectedImageIndex = index;
            document.querySelectorAll('.image-option').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
        }

        function startGame() {
            gridSize = parseInt(document.getElementById('gridSize').value);
            const boardPixels = Math.min(window.innerWidth - 60, 450);
            tileSize = Math.floor((boardPixels - (gridSize - 1) * 3) / gridSize);

            moveCount = 0;
            document.getElementById('moveCount').textContent = '0';
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('completeOverlay').classList.remove('show');
            gameStarted = false;

            const previewImg = document.getElementById('previewImage');
            previewImg.src = images[selectedImageIndex].src;

            initBoard();
            shufflePuzzle();
        }

        function initBoard() {
            const board = document.getElementById('puzzleBoard');
            const totalSize = tileSize * gridSize + (gridSize - 1) * 3;
            board.style.gridTemplateColumns = `repeat(${gridSize}, ${tileSize}px)`;
            board.style.gridTemplateRows = `repeat(${gridSize}, ${tileSize}px)`;
            board.style.width = totalSize + 'px';
            board.style.height = totalSize + 'px';

            const totalTiles = gridSize * gridSize;
            tiles = Array.from({ length: totalTiles }, (_, i) => i);
            emptyIndex = totalTiles - 1;

            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('puzzleBoard');
            board.innerHTML = '';
            const imgSrc = images[selectedImageIndex].src;
            const totalImgSize = tileSize * gridSize + (gridSize - 1) * 3;

            tiles.forEach((tile, index) => {
                const div = document.createElement('div');
                div.className = 'puzzle-tile' + (tile === gridSize * gridSize - 1 ? ' empty' : '');
                div.style.width = tileSize + 'px';
                div.style.height = tileSize + 'px';

                if (tile !== gridSize * gridSize - 1) {
                    const col = tile % gridSize;
                    const row = Math.floor(tile / gridSize);
                    div.style.backgroundImage = `url(${imgSrc})`;
                    div.style.backgroundSize = `${totalImgSize}px ${totalImgSize}px`;
                    div.style.backgroundPosition = `-${col * (tileSize + 3)}px -${row * (tileSize + 3)}px`;
                }

                div.onclick = () => moveTile(index);
                board.appendChild(div);
            });
        }

        function getNeighbors(index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const neighbors = [];
            if (row > 0) neighbors.push(index - gridSize);
            if (row < gridSize - 1) neighbors.push(index + gridSize);
            if (col > 0) neighbors.push(index - 1);
            if (col < gridSize - 1) neighbors.push(index + 1);
            return neighbors;
        }

        function moveTile(index) {
            const emptyPos = tiles.indexOf(gridSize * gridSize - 1);
            const neighbors = getNeighbors(index);

            if (neighbors.includes(emptyPos)) {
                [tiles[index], tiles[emptyPos]] = [tiles[emptyPos], tiles[index]];
                moveCount++;
                document.getElementById('moveCount').textContent = moveCount;

                if (!gameStarted) {
                    gameStarted = true;
                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 1000);
                }

                renderBoard();
                checkWin();
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        function shufflePuzzle() {
            moveCount = 0;
            document.getElementById('moveCount').textContent = '0';
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('completeOverlay').classList.remove('show');
            gameStarted = false;

            const totalTiles = gridSize * gridSize;
            let emptyPos = tiles.indexOf(totalTiles - 1);

            for (let i = 0; i < gridSize * gridSize * 50; i++) {
                const neighbors = getNeighbors(emptyPos);
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                [tiles[emptyPos], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyPos]];
                emptyPos = randomNeighbor;
            }

            renderBoard();
        }

        function checkWin() {
            const won = tiles.every((tile, index) => tile === index);
            if (won) {
                clearInterval(timerInterval);
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;

                document.getElementById('completeStats').textContent =
                    `${moveCount}手 / ${timeStr}`;
                document.getElementById('completeOverlay').classList.add('show');
            }
        }

        function togglePreview() {
            const preview = document.getElementById('previewImage');
            preview.classList.toggle('show');
            const toggle = document.querySelector('.preview-toggle');
            toggle.textContent = preview.classList.contains('show')
                ? '[ 完成図を非表示 ]'
                : '[ 完成図を表示 ]';
        }

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    images.push({ name: file.name, src: ev.target.result });
                    selectedImageIndex = images.length - 1;
                    initImageSelect();
                    startGame();
                };
                reader.readAsDataURL(file);
            }
        });

        initImageSelect();
        startGame();
    </script>
</body>
</html>
